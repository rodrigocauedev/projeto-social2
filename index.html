<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Social</title>
    <style>
        body {
            background-image: url(imagens/fundo-madeira.jpg);
            background-repeat: no-repeat;
            background-position: top center;
            width: 100vw;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        #telefone {
            background-image: url(imagens/frame-iphone.png);
            background-repeat: no-repeat;
            height: 628px;
            width: 311px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #tela {
            position: relative;
            top: 80px;
            left: 22px;
            height: 472px;
            width: 268px;
        }

        #redes {
            display: flex;
            flex-flow: column;
            align-items: flex-end;
            margin-right: 20px;
        }

        a {
            margin-top: 10px;
            text-align: right;
        }

        img {
            display: block;
            width: 60px;
            border-radius: 50%;
            border: 2px solid black;
        }

        img:hover {
            transform: translate(-5%, -5%);
        }
    </style>
</head>
<body>
    <div id="telefone">
        <iframe src="home.html" frameborder="0" name="redes" id="tela"></iframe>
    </div>

    <div id="redes">
        <a href="home.html" target="redes"><img src="imagens/logo-home.jpg" alt=""></a>
        <a href="instagram.html" target="redes"><img src="imagens/logo-instagram.jpg" alt=""></a>
        <a href="git.html" target="redes"><img src="imagens/logo-github.jpg" alt=""></a>
    </div>
</body>
</html>
